<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Countdown Timer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            mono: ['JetBrains Mono', 'Courier New', 'monospace'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          animation: {
            'flash-screen': 'flash 0.8s infinite alternate',
          },
          keyframes: {
            flash: {
              '0%': { backgroundColor: '#ef4444', color: '#ffffff' },
              '100%': { backgroundColor: '#111827', color: '#f87171' }
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom flashing animations for light and dark modes */
    .flash-alert-dark {
      animation: flashDark 0.6s infinite alternate !important;
    }
    .flash-alert-light {
      animation: flashLight 0.6s infinite alternate !important;
    }

    @keyframes flashDark {
      0% { background-color: #0f172a; color: #f87171; }
      100% { background-color: #dc2626; color: #ffffff; }
    }

    @keyframes flashLight {
      0% { background-color: #ffffff; color: #dc2626; }
      100% { background-color: #ef4444; color: #ffffff; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-300 font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Header / Controls -->
  <header class="w-full max-w-2xl mx-auto p-4 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <svg class="w-6 h-6 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      <span class="font-bold tracking-wider text-sm uppercase text-slate-500 dark:text-slate-400">Timer</span>
    </div>

    <!-- Theme Toggle Button -->
    <button id="themeToggleBtn" onclick="toggleTheme()" class="p-2.5 rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 transition-all text-slate-700 dark:text-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <!-- Sun Icon -->
      <svg id="sunIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
      </svg>
      <!-- Moon Icon -->
      <svg id="moonIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
      </svg>
    </button>
  </header>

  <!-- Main Timer Display Container -->
  <main class="w-full max-w-xl mx-auto px-4 flex-1 flex flex-col items-center justify-center text-center">
    
    <!-- Big Digital Display -->
    <div id="displayContainer" class="my-6 py-8 px-6 rounded-3xl w-full transition-all duration-300">
      <div id="timerDisplay" class="font-mono text-7xl sm:text-9xl font-extrabold tracking-tight select-none">
        05:00
      </div>
      <p id="statusLabel" class="text-xs uppercase tracking-widest text-slate-400 dark:text-slate-500 font-semibold mt-2 h-4">Ready</p>
    </div>

    <!-- Quick Preset Buttons -->
    <div class="flex flex-wrap justify-center gap-2 mb-6 w-full max-w-md">
      <button onclick="setPresetMinutes(5)" class="px-4 py-2 text-sm font-semibold rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-indigo-500 hover:text-white dark:hover:bg-indigo-600 transition-all">
        5 Min
      </button>
      <button onclick="setPresetMinutes(10)" class="px-4 py-2 text-sm font-semibold rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-indigo-500 hover:text-white dark:hover:bg-indigo-600 transition-all">
        10 Min
      </button>
      <button onclick="addMinutes(5)" class="px-4 py-2 text-sm font-semibold rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 transition-all text-slate-600 dark:text-slate-400">
        +5 Min
      </button>
      <button onclick="addMinutes(10)" class="px-4 py-2 text-sm font-semibold rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 transition-all text-slate-600 dark:text-slate-400">
        +10 Min
      </button>
    </div>

    <!-- Primary Control Buttons (Start/Pause, Reset) -->
    <div class="flex items-center justify-center gap-4 mb-8 w-full max-w-xs">
      <button id="startPauseBtn" onclick="toggleTimer()" class="flex-1 py-4 px-6 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-lg shadow-lg shadow-indigo-500/25 transition-all transform active:scale-95">
        Start
      </button>
      <button id="resetBtn" onclick="resetTimer()" class="py-4 px-6 rounded-2xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 font-bold text-lg transition-all transform active:scale-95 text-slate-700 dark:text-slate-300">
        Reset
      </button>
    </div>

    <!-- Custom Time Inputs -->
    <div class="bg-white dark:bg-slate-800/50 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 w-full max-w-sm">
      <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Set Custom Duration</label>
      <div class="flex items-center justify-center space-x-2">
        <div class="flex flex-col items-center">
          <input type="number" id="minInput" min="0" max="999" value="5" placeholder="0" oninput="applyCustomTime()" class="w-20 p-2 text-center text-lg font-mono rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <span class="text-xs text-slate-400 mt-1">Minutes</span>
        </div>
        <span class="text-2xl font-mono text-slate-400 pb-5">:</span>
        <div class="flex flex-col items-center">
          <input type="number" id="secInput" min="0" max="59" value="0" placeholder="00" oninput="applyCustomTime()" class="w-20 p-2 text-center text-lg font-mono rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <span class="text-xs text-slate-400 mt-1">Seconds</span>
        </div>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="w-full text-center py-4 text-xs text-slate-400 dark:text-slate-600">
    Minimalist Timer &bull; Silent Visual Alert
  </footer>

  <script>
    // App State
    let totalSeconds = 300; // Default 5 minutes
    let remainingSeconds = 300;
    let timerInterval = null;
    let isRunning = false;
    let flashTimeout = null;

    // DOM Elements
    const timerDisplay = document.getElementById('timerDisplay');
    const startPauseBtn = document.getElementById('startPauseBtn');
    const minInput = document.getElementById('minInput');
    const secInput = document.getElementById('secInput');
    const statusLabel = document.getElementById('statusLabel');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');

    // Theme Logic
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light' || (!savedTheme && window.matchMedia('(prefers-color-scheme: light)').matches)) {
        document.documentElement.classList.remove('dark');
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
      } else {
        document.documentElement.classList.add('dark');
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
      }
    }

    function toggleTheme() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
      }
    }

    // Format & Render Display
    function updateDisplay() {
      const mins = Math.floor(remainingSeconds / 60);
      const secs = remainingSeconds % 60;
      
      const formattedMins = String(mins).padStart(2, '0');
      const formattedSecs = String(secs).padStart(2, '0');

      timerDisplay.textContent = `${formattedMins}:${formattedSecs}`;
      document.title = isRunning ? `(${formattedMins}:${formattedSecs}) Timer` : 'Minimalist Countdown Timer';
    }

    // Timer Controls
    function toggleTimer() {
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      if (remainingSeconds <= 0) return;
      
      stopFlashing();
      isRunning = true;
      startPauseBtn.textContent = 'Pause';
      startPauseBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
      startPauseBtn.classList.add('bg-amber-500', 'hover:bg-amber-600');
      statusLabel.textContent = 'Running';

      timerInterval = setInterval(() => {
        remainingSeconds--;
        updateDisplay();

        if (remainingSeconds <= 0) {
          handleComplete();
        }
      }, 1000);
    }

    function pauseTimer() {
      isRunning = false;
      clearInterval(timerInterval);
      startPauseBtn.textContent = 'Start';
      startPauseBtn.classList.remove('bg-amber-500', 'hover:bg-amber-600');
      startPauseBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
      statusLabel.textContent = 'Paused';
    }

    function resetTimer() {
      pauseTimer();
      stopFlashing();
      remainingSeconds = totalSeconds;
      statusLabel.textContent = 'Ready';
      updateDisplay();
    }

    // Time Adjustments & Inputs
    function setPresetMinutes(mins) {
      pauseTimer();
      stopFlashing();
      totalSeconds = mins * 60;
      remainingSeconds = totalSeconds;
      
      minInput.value = mins;
      secInput.value = 0;
      statusLabel.textContent = 'Ready';
      updateDisplay();
    }

    function addMinutes(mins) {
      stopFlashing();
      totalSeconds += mins * 60;
      remainingSeconds += mins * 60;
      
      minInput.value = Math.floor(totalSeconds / 60);
      secInput.value = totalSeconds % 60;
      updateDisplay();
    }

    function applyCustomTime() {
      pauseTimer();
      stopFlashing();

      let mins = parseInt(minInput.value) || 0;
      let secs = parseInt(secInput.value) || 0;

      // Bound seconds cleanly
      if (secs > 59) {
        secs = 59;
        secInput.value = 59;
      }

      totalSeconds = (mins * 60) + secs;
      remainingSeconds = totalSeconds;
      statusLabel.textContent = 'Ready';
      updateDisplay();
    }

    // Visual Completion Alert (Silent Flash for 10 seconds)
    function handleComplete() {
      pauseTimer();
      statusLabel.textContent = 'Time Up!';
      
      // Determine dark mode state for flash style
      const isDark = document.documentElement.classList.contains('dark');
      const flashClass = isDark ? 'flash-alert-dark' : 'flash-alert-light';
      
      document.body.classList.add(flashClass);

      // Stop flashing automatically after 10 seconds (10000 ms)
      flashTimeout = setTimeout(() => {
        stopFlashing();
      }, 10000);
    }

    function stopFlashing() {
      if (flashTimeout) clearTimeout(flashTimeout);
      document.body.classList.remove('flash-alert-dark', 'flash-alert-light');
    }

    // Initialize on page load
    window.onload = function() {
      initTheme();
      updateDisplay();
    };
  </script>
</body>
</html>
